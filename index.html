<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>CS立体図</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="description" content="産総研シームレス標高タイルをベースに、各都道府県が公開しているCS立体図をオーバーレイ表示する地図ビューワ" />
  </head>
  <body>
    <div id="map"></div>

    <section id="panel" class="panel" aria-label="コントロールパネル">
      <header class="panel-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🗻</span>
          <h1>CS立体図ビューワ</h1>
        </div>
        <div class="head-actions">
          <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
          <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
        </div>
      </header>

      <div id="panel-body" class="panel-body">
        <div class="field">
          <div class="field-head">
            <span class="field-label">CS立体図</span>
            <div class="field-actions">
              <button id="cs-all-on" class="mini-btn" type="button">全ON</button>
              <button id="cs-all-off" class="mini-btn" type="button">全OFF</button>
            </div>
          </div>
          <div id="cs-layers" class="toggles"></div>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="field-label">CS立体図 不透明度</span>
            <span id="cs-opacity-value" class="op-val">80%</span>
          </div>
          <input id="cs-opacity" class="opacity-range" type="range" min="0" max="100" step="1" value="80" aria-label="CS立体図の不透明度" />
        </div>

        <div class="field">
          <div class="field-head">
            <span class="field-label">各種レイヤー</span>
            <div class="field-actions">
              <button id="other-all-on" class="mini-btn" type="button">全ON</button>
              <button id="other-all-off" class="mini-btn" type="button">全OFF</button>
            </div>
          </div>
          <div id="other-layers" class="toggles"></div>
        </div>

        <div class="field">
          <span class="field-label">地図中心</span>
          <div id="coords" class="coords"></div>
        </div>
      </div>

      <footer class="panel-foot">
        背景: 国土地理院 最適化ベクトルタイル（淡色地図風スタイル）<br />
        標高: <a href="https://tiles.gsj.jp/tiles/elev/tiles.html" target="_blank" rel="noopener">産総研 シームレス標高タイル</a><br />
        <a href="https://twitter.com/shi__works" target="_blank" rel="noopener">X(旧Twitter)</a>
        ｜
        <a href="https://github.com/shiwaku/csmap-on-maplibre" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </section>

    <div class="map-center-marker">+</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
